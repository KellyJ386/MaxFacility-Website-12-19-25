<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Certified Ice Rink Manager">
  <defs>
    <path id="cirm-top" d="M100 100 m-74 0 a74 74 0 0 1 148 0" />
    <path id="cirm-bot" d="M100 100 m-70 0 a70 70 0 0 0 140 0" />
  </defs>
  <circle cx="100" cy="100" r="96" fill="#0d2b4f" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#5cb733" stroke-width="3" />
  <circle cx="100" cy="100" r="62" fill="#e8f3fa" />

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#ffffff">
    <textPath href="#cirm-top" startOffset="50%" text-anchor="middle">CERTIFIED ICE RINK MANAGER</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" letter-spacing="2" fill="#5cb733">
    <textPath href="#cirm-bot" startOffset="50%" text-anchor="middle">ICE RINK MANAGERS ASSOCIATION</textPath>
  </text>

  <!-- Mini rink diagram motif -->
  <g transform="translate(72,74)">
    <rect x="0" y="0" width="56" height="30" rx="10" fill="#e8f3fa" stroke="#0d2b4f" stroke-width="2.5" />
    <line x1="28" y1="0" x2="28" y2="30" stroke="#d81f26" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="17" y1="0" x2="17" y2="30" stroke="#1544bb" stroke-width="1.5" />
    <line x1="39" y1="0" x2="39" y2="30" stroke="#1544bb" stroke-width="1.5" />
    <circle cx="28" cy="15" r="7" fill="none" stroke="#1544bb" stroke-width="1.5" />
    <circle cx="28" cy="15" r="1.8" fill="#d81f26" />
  </g>
  <text x="100" y="122" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="1" text-anchor="middle" fill="#0d2b4f">CIRM</text>
  <path d="M76 134 h48" stroke="#5cb733" stroke-width="3" stroke-linecap="round" />
</svg>
