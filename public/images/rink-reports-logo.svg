<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Rink Reports">
  <defs>
    <clipPath id="rink">
      <rect x="12" y="12" width="776" height="356" rx="128" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0d2b4f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ice surface and boards -->
  <rect x="12" y="12" width="776" height="356" rx="128" fill="#e8f3fa" stroke="#0d2b4f" stroke-width="13" />

  <g clip-path="url(#rink)">
    <!-- Goal lines -->
    <line x1="90" y1="12" x2="90" y2="368" stroke="#d81f26" stroke-width="4" />
    <line x1="710" y1="12" x2="710" y2="368" stroke="#d81f26" stroke-width="4" />

    <!-- Goal creases -->
    <path d="M90 160 A30 30 0 0 1 90 220 Z" fill="#cfe8f7" stroke="#1544bb" stroke-width="3" />
    <path d="M710 160 A30 30 0 0 0 710 220 Z" fill="#cfe8f7" stroke="#1544bb" stroke-width="3" />

    <!-- Blue lines -->
    <line x1="265" y1="12" x2="265" y2="368" stroke="#1544bb" stroke-width="10" />
    <line x1="535" y1="12" x2="535" y2="368" stroke="#1544bb" stroke-width="10" />

    <!-- Center line -->
    <line x1="400" y1="12" x2="400" y2="368" stroke="#d81f26" stroke-width="6" stroke-dasharray="18 12" />
  </g>

  <!-- Center faceoff circle -->
  <circle cx="400" cy="190" r="62" stroke="#1544bb" stroke-width="4" fill="none" />
  <circle cx="400" cy="190" r="7" fill="#d81f26" />

  <!-- End-zone faceoff circles with hash crosses -->
  <g stroke="#d81f26" stroke-width="4" fill="none">
    <g>
      <circle cx="152" cy="102" r="58" />
      <path d="M132 102 h14 M158 102 h14 M152 82 v14 M152 108 v14" />
    </g>
    <g>
      <circle cx="152" cy="278" r="58" />
      <path d="M132 278 h14 M158 278 h14 M152 258 v14 M152 284 v14" />
    </g>
    <g>
      <circle cx="648" cy="102" r="58" />
      <path d="M628 102 h14 M654 102 h14 M648 82 v14 M648 108 v14" />
    </g>
    <g>
      <circle cx="648" cy="278" r="58" />
      <path d="M628 278 h14 M654 278 h14 M648 258 v14 M648 284 v14" />
    </g>
  </g>
  <g fill="#d81f26">
    <circle cx="152" cy="102" r="5" />
    <circle cx="152" cy="278" r="5" />
    <circle cx="648" cy="102" r="5" />
    <circle cx="648" cy="278" r="5" />
  </g>

  <!-- Neutral-zone faceoff dots -->
  <g fill="#d81f26">
    <circle cx="330" cy="102" r="6" />
    <circle cx="330" cy="278" r="6" />
    <circle cx="470" cy="102" r="6" />
    <circle cx="470" cy="278" r="6" />
  </g>

  <!-- Measurement-sensor dots: dashed ring with solid center -->
  <g stroke-width="5" stroke-dasharray="6 6" fill="none">
    <!-- Left end zone -->
    <circle cx="108" cy="70" r="14" stroke="#5cb733" />
    <circle cx="200" cy="70" r="14" stroke="#16355e" />
    <circle cx="108" cy="150" r="14" stroke="#16355e" />
    <circle cx="200" cy="150" r="14" stroke="#5cb733" />
    <circle cx="108" cy="230" r="14" stroke="#16355e" />
    <circle cx="200" cy="230" r="14" stroke="#5cb733" />
    <circle cx="108" cy="310" r="14" stroke="#5cb733" />
    <circle cx="200" cy="310" r="14" stroke="#16355e" />
    <!-- Neutral zone -->
    <circle cx="300" cy="62" r="14" stroke="#5cb733" />
    <circle cx="500" cy="62" r="14" stroke="#16355e" />
    <circle cx="300" cy="318" r="14" stroke="#16355e" />
    <circle cx="500" cy="318" r="14" stroke="#5cb733" />
    <!-- Right end zone -->
    <circle cx="600" cy="70" r="14" stroke="#16355e" />
    <circle cx="692" cy="70" r="14" stroke="#5cb733" />
    <circle cx="600" cy="150" r="14" stroke="#5cb733" />
    <circle cx="692" cy="150" r="14" stroke="#16355e" />
    <circle cx="600" cy="230" r="14" stroke="#5cb733" />
    <circle cx="692" cy="230" r="14" stroke="#16355e" />
    <circle cx="600" cy="310" r="14" stroke="#16355e" />
    <circle cx="692" cy="310" r="14" stroke="#5cb733" />
  </g>
  <g>
    <circle cx="108" cy="70" r="4.5" fill="#5cb733" />
    <circle cx="200" cy="70" r="4.5" fill="#16355e" />
    <circle cx="108" cy="150" r="4.5" fill="#16355e" />
    <circle cx="200" cy="150" r="4.5" fill="#5cb733" />
    <circle cx="108" cy="230" r="4.5" fill="#16355e" />
    <circle cx="200" cy="230" r="4.5" fill="#5cb733" />
    <circle cx="108" cy="310" r="4.5" fill="#5cb733" />
    <circle cx="200" cy="310" r="4.5" fill="#16355e" />
    <circle cx="300" cy="62" r="4.5" fill="#5cb733" />
    <circle cx="500" cy="62" r="4.5" fill="#16355e" />
    <circle cx="300" cy="318" r="4.5" fill="#16355e" />
    <circle cx="500" cy="318" r="4.5" fill="#5cb733" />
    <circle cx="600" cy="70" r="4.5" fill="#16355e" />
    <circle cx="692" cy="70" r="4.5" fill="#5cb733" />
    <circle cx="600" cy="150" r="4.5" fill="#5cb733" />
    <circle cx="692" cy="150" r="4.5" fill="#16355e" />
    <circle cx="600" cy="230" r="4.5" fill="#5cb733" />
    <circle cx="692" cy="230" r="4.5" fill="#16355e" />
    <circle cx="600" cy="310" r="4.5" fill="#16355e" />
    <circle cx="692" cy="310" r="4.5" fill="#5cb733" />
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle"
     fill="#5cb733" stroke="#ffffff" stroke-width="16" paint-order="stroke" stroke-linejoin="round"
     filter="url(#shadow)">
    <text x="400" y="176" font-size="96" letter-spacing="6">RINK</text>
    <text x="400" y="270" font-size="64" letter-spacing="5">REPORTS</text>
  </g>
</svg>
