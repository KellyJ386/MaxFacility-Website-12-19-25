  </g>
  <text x="100" y="124" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="1" text-anchor="middle" fill="#0d2b4f">CRA</text>
  <path d="M78 136 h44" stroke="#5cb733" stroke-width="3" stroke-linecap="round" />
</svg>
