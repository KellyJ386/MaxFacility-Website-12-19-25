<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Certified Rink Administrator">
  <defs>
    <path id="cra-top" d="M100 100 m-74 0 a74 74 0 0 1 148 0" />
    <path id="cra-bot" d="M100 100 m-70 0 a70 70 0 0 0 140 0" />
  </defs>
  <circle cx="100" cy="100" r="96" fill="#0d2b4f" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#5cb733" stroke-width="3" />
  <circle cx="100" cy="100" r="62" fill="#e8f3fa" />

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1" fill="#ffffff">
